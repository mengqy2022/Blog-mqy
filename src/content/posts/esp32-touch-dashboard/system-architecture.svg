<g fill="#b8d5ff" font-size="15" text-anchor="middle"><text x="520" y="338">USB UART</text><text x="520" y="362">115200 baud</text><text x="520" y="405">Data + pixels</text><text x="520" y="428">Touch + replies</text></g>
<g fill="#b6c6da" font-size="16"><text x="44" y="479">AI usage sends totals, not conversation text.</text><text x="44" y="510">PC SCREEN sends the chosen window's pixels.</text><text x="44" y="541">Salary Cat works offline after time sync.</text><text x="44" y="572">Calendar updates preserve personal exceptions.</text></g>
