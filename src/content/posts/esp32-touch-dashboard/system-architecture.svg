<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 Touch Monitor system architecture</title>
  <desc id="desc">Windows gathers PC metrics and local Codex usage. A companion sends numeric data over USB UART to an ESP32, which renders the dashboard and runs tools backed by SD storage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7aa6d5"/></marker>
  </defs>
  <rect width="960" height="600" rx="24" fill="#101722"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="47" fill="#edf4ff" font-size="24" font-weight="700">ONE LINK. TWO INDEPENDENT SYSTEMS.</text>
    <text x="40" y="76" fill="#a6b8cf" font-size="16">The PC samples and summarizes. The ESP32 draws and interacts.</text>
    <rect x="32" y="104" width="416" height="448" rx="18" fill="#182436" stroke="#304662"/>
    <rect x="512" y="104" width="416" height="448" rx="18" fill="#182436" stroke="#304662"/>
    <text x="56" y="141" fill="#79b9ff" font-size="19" font-weight="700">WINDOWS HOST</text>
    <text x="536" y="141" fill="#6de5c1" font-size="19" font-weight="700">ESP32 TOUCH TERMINAL</text>
    <g fill="#22344b" stroke="#425b79">
      <rect x="56" y="164" width="176" height="90" rx="10"/>
      <rect x="248" y="164" width="176" height="90" rx="10"/>
      <rect x="72" y="326" width="352" height="92" rx="10"/>
      <rect x="536" y="326" width="352" height="92" rx="10"/>
      <rect x="536" y="164" width="352" height="90" rx="10"/>
      <rect x="536" y="462" width="352" height="62" rx="10"/>
    </g>
    <g fill="#edf4ff" font-size="18" font-weight="700" text-anchor="middle">
      <text x="144" y="199">PC metrics</text>
      <text x="336" y="199">Codex usage</text>
      <text x="248" y="362">Windows companion</text>
      <text x="712" y="362">Single UART reader</text>
      <text x="712" y="199">LVGL dashboard</text>
      <text x="712" y="490">Local apps + SD storage</text>
    </g>
    <g fill="#b6c6da" font-size="15" text-anchor="middle">
      <text x="144" y="228">CPU / GPU / RAM</text>
      <text x="336" y="228">Local logs + prices</text>
      <text x="248" y="389">Sampling, time sync, device detection</text>
      <text x="712" y="389">PC packets / FILE transfers</text>
      <text x="712" y="228">Gauges, tokens, touch navigation</text>
      <text x="712" y="512">Games / Inventory / Vocab Lab</text>
    </g>
    <g fill="none" stroke="#7aa6d5" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M144 254V290H248V326"/>
      <path d="M336 254V290H248"/>
      <path d="M424 372H536"/>
      <path d="M712 326V254"/>
      <path d="M712 418V462"/>
    </g>
    <text x="480" y="345" fill="#b8d5ff" font-size="15" text-anchor="middle">USB</text>
    <text x="480" y="406" fill="#b8d5ff" font-size="14" text-anchor="middle">UART</text>
    <text x="248" y="468" fill="#b6c6da" font-size="15" text-anchor="middle">Only numeric summaries cross the link.</text>
    <text x="248" y="493" fill="#b6c6da" font-size="15" text-anchor="middle">No prompts, replies, or API keys.</text>
    <text x="40" y="579" fill="#91a9c5" font-size="14">ESP32 Touch Monitor · Esp32-s3-touch project · October 2026</text>
  </g>
</svg>
