<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" role="img" aria-labelledby="title desc">
<title id="title">ESP32 Touch Monitor system architecture, October 2026</title>
<desc id="desc">Windows gathers PC metrics, local Codex and Claude usage, a selected window, files, time, and work-calendar data. One bidirectional USB UART link reaches a single reader on the ESP32. LVGL renders the dashboard and local tools, with settings and calendars in NVS and inventory and vocabulary on SD.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7aa6d5"/></marker></defs>
<rect width="1040" height="680" rx="24" fill="#101722"/><g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="45" fill="#edf4ff" font-size="24" font-weight="700">ONE USB LINK. CONNECTED AND LOCAL TOOLS.</text><text x="32" y="75" fill="#a6b8cf" font-size="16">Windows collects and captures. The ESP32 renders, calculates, and handles touch.</text>
<g fill="#182436" stroke="#304662"><rect x="24" y="100" width="428" height="534" rx="18"/><rect x="588" y="100" width="428" height="534" rx="18"/></g>
