<g fill="#22344b" stroke="#425b79"><rect x="44" y="160" width="388" height="132" rx="10"/><rect x="44" y="332" width="388" height="92" rx="10"/><rect x="608" y="332" width="388" height="92" rx="10"/><rect x="608" y="160" width="388" height="132" rx="10"/><rect x="608" y="470" width="388" height="136" rx="10"/></g>
<g fill="#edf4ff" font-size="18" font-weight="700" text-anchor="middle"><text x="238" y="190">Local data sources</text><text x="238" y="365">Windows companion</text><text x="802" y="365">Single UART reader</text><text x="802" y="190">LVGL pages + touch</text><text x="802" y="500">Local apps + storage</text></g>
<g fill="#b6c6da" font-size="16" text-anchor="middle"><text x="238" y="218">CPU / GPU / RAM</text><text x="238" y="245">Codex + Claude logs / selected window</text><text x="238" y="272">Files / clock / yearly work calendar</text><text x="238" y="393">Sampling, capture, sync, input routing</text><text x="802" y="393">PC / SCREEN / FILE / SALARY</text><text x="802" y="218">PC telemetry / AI usage</text><text x="802" y="245">PC SCREEN / Salary Cat</text><text x="802" y="272">Games / system / inventory / vocabulary</text><text x="802" y="531">Salary calculation + cat animation</text><text x="802" y="559">NVS: settings, calendar, calibration</text><text x="802" y="587">SD: inventory, books, study progress</text></g>
